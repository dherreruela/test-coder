server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Support React Router (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests to the backend service.
    # Uncomment and adjust the backend service name if you want nginx
    # to forward /api calls directly to the backend container.
    #
    # location /api/ {
    #     proxy_pass http://backend:5000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
